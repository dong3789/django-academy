<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson — Django Academy</title><link rel="stylesheet" href="style.css?v=3">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>.mermaid{background:#161b22;border-radius:8px;padding:10px;margin:14px 0;overflow-x:auto;text-align:center}.mermaid svg{max-width:100%;height:auto}</style></head><body>
<header><a href="index.html">🐍 Django Academy</a></header><main>
<div id="content">불러오는 중…</div>
<label style="display:block;margin:20px 0;font-size:1.1em"><input type="checkbox" id="done"> 이 레슨 완료</label>
<div class="nav"><span id="prev"></span><a href="index.html">목차</a><span id="next"></span></div></main>
<script>
const day=+new URLSearchParams(location.search).get('day')||1, id=String(day).padStart(3,'0');
fetch('lessons/index.json').then(r=>r.json()).then(idx=>{
 const L=idx.lessons.sort((a,b)=>a.day-b.day), i=L.findIndex(l=>l.day===day), cur=L[i];
 if(!cur){content.textContent='아직 공개되지 않은 레슨입니다.';return}
 document.title=`Day ${day}: ${cur.title}`;
 if(L[i-1])prev.innerHTML=`<a href="?day=${L[i-1].day}">← Day ${L[i-1].day}</a>`;
 if(L[i+1])next.innerHTML=`<a href="?day=${L[i+1].day}">Day ${L[i+1].day} →</a>`;
 return fetch('lessons/'+cur.file).then(r=>r.text()).then(md=>{content.innerHTML=marked.parse(md);renderMermaid();document.querySelectorAll('pre code').forEach(e=>hljs.highlightElement(e))});
});
function renderMermaid(){
 if(!window.mermaid)return;
 const els=[];
 document.querySelectorAll('pre code.language-mermaid').forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.parentElement.replaceWith(d);els.push(d)});
 if(!els.length)return;
 mermaid.initialize({startOnLoad:false,theme:'dark',securityLevel:'strict',fontSize:14,flowchart:{useMaxWidth:true,htmlLabels:true},sequence:{useMaxWidth:true}});
 mermaid.run({nodes:els}).catch(e=>console.error(e));
}
const cb=document.getElementById('done');cb.checked=localStorage.getItem('done-'+id)==='1';
cb.onchange=()=>localStorage.setItem('done-'+id,cb.checked?'1':'0');
</script></body></html>
